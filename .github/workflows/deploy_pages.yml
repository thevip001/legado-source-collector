name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Run Source Collector"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download collector artifact
        uses: actions/download-artifact@v4
        with:
          name: sources_output
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add landing page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legado 书源</title></head>
          <body>
            <h1>Legado / 阅读 APP 书源</h1>
            <p><a href="valid_sources.json">下载有效书源（valid_sources.json）</a></p>
            <p><a href="invalid_sources.json">下载无效书源记录（invalid_sources.json）</a></p>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
