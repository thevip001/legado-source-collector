name: Run Source Collector

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 0 * * 0'  # 每周日 UTC 0 点自动运行

permissions:
  contents: write  # 允许推送代码到仓库

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run source collector
        run: python legado_source_collector.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sources_output
          path: |
            valid_sources.json
            invalid_sources.json
          retention-days: 30

      - name: Commit and push to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 保存生成的文件到临时目录
          mkdir -p /tmp/sources_output
          cp valid_sources.json invalid_sources.json /tmp/sources_output/
          
          # 切换到 output 分支（只保留书源文件）
          git fetch origin
          git checkout -B output || git checkout --orphan output
          git rm -rf . 2>/dev/null || true
          
          # 从临时目录复制回来
          cp /tmp/sources_output/valid_sources.json /tmp/sources_output/invalid_sources.json ./
          
          git add valid_sources.json invalid_sources.json
          git commit -m "Auto-update sources: $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push -f origin output
