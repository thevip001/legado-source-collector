name: Run Source Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # 每周日 UTC 00:00（北京时间 08:00）

permissions:
  contents: write

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect and validate sources
        run: python legado_source_collector.py

      - name: Check generated source count
        run: |
          python - <<'PY'
          import json
          with open('valid_sources.json', encoding='utf-8') as f:
              sources = json.load(f)
          if not isinstance(sources, list) or not sources:
              raise SystemExit('valid_sources.json is empty; refusing to publish')
          print(f'Validated {len(sources)} importable sources')
          PY

      - name: Upload generated source files
        uses: actions/upload-artifact@v4
        with:
          name: sources_output
          path: |
            valid_sources.json
            pending_sources.json
            invalid_sources.json
          retention-days: 30

      - name: Commit latest files to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sources_output
          cp valid_sources.json pending_sources.json invalid_sources.json /tmp/sources_output/
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . 2>/dev/null || true
          fi
          rm -f valid_sources.json pending_sources.json invalid_sources.json
          cp /tmp/sources_output/valid_sources.json /tmp/sources_output/pending_sources.json /tmp/sources_output/invalid_sources.json ./
          git add valid_sources.json pending_sources.json invalid_sources.json
          git commit -m "Auto-update sources: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push origin output
