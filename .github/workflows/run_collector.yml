name: Run Source Collector

on:
  workflow_dispatch:  # 手动触发
  # schedule:
  #   - cron: '0 0 * * 0'  # 可选：每周日 UTC 0 点自动运行

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run source collector
        run: python legado_source_collector.py

      - name: Upload valid sources
        uses: actions/upload-artifact@v4
        with:
          name: valid_sources
          path: valid_sources.json
          retention-days: 30

      - name: Upload invalid sources
        uses: actions/upload-artifact@v4
        with:
          name: invalid_sources
          path: invalid_sources.json
          retention-days: 30
