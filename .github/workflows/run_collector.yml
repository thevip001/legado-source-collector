name: Run Source Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *' # 每 3 天 UTC 00:00；GitHub 可能延迟执行

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect, filter and de-duplicate sources
        run: python legado_source_collector.py

      - name: Verify valid output is non-empty JSON
        run: |
          python - <<'PY'
          import json
          with open('valid_sources.json', encoding='utf-8') as f:
              sources = json.load(f)
          assert isinstance(sources, list) and len(sources) > 0, 'Refusing to publish empty valid_sources.json'
          print(f'Ready to publish {len(sources)} sources')
          PY

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: sources_output
          path: |
            valid_sources.json
            invalid_sources.json
          retention-days: 30

      - name: Update output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/legado-output
          cp valid_sources.json invalid_sources.json /tmp/legado-output/
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . 2>/dev/null || true
          fi
          rm -f valid_sources.json invalid_sources.json
          cp /tmp/legado-output/valid_sources.json /tmp/legado-output/invalid_sources.json .
          git add valid_sources.json invalid_sources.json
          git commit -m "Auto-update sources: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No content changes"
          git push origin output
