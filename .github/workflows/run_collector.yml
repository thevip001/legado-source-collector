name: Run Source Collector

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 0 * * 0'  # 每周日 UTC 0 点自动运行

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run source collector
        run: python legado_source_collector.py

      - name: Create output directory
        run: |
          mkdir -p output
          cp valid_sources.json output/
          cp invalid_sources.json output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sources_output
          path: output/
          retention-days: 30

      - name: Commit and push to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B output || git checkout --orphan output
          git rm -rf . 2>/dev/null || true
          cp valid_sources.json invalid_sources.json ./
          git add valid_sources.json invalid_sources.json
          git commit -m "Auto-update sources: $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push -f origin output
