name: Fetch from Input Collections

on:
  schedule:
    # 每天 UTC 00:00 运行
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-input"
  cancel-in-progress: false

jobs:
  fetch-from-input:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Fetch from input collections
        run: |
          python fetch_from_input.py

      - name: Check if new sources are non-empty
        id: check
        run: |
          if [ ! -f output/valid_sources.json ]; then
            echo "No valid_sources.json generated, skipping deploy."
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          COUNT=$(python -c "import json; print(len(json.load(open('output/valid_sources.json'))))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -eq 0 ]; then
            echo "No valid sources fetched, skipping deploy."
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        if: steps.check.outputs.skip_deploy == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: fetch-from-input
    if: needs.fetch-from-input.outputs.skip_deploy != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
